<app-navbar></app-navbar>

<mat-sidenav-container class="w-full h-full">

  <mat-sidenav
    #drawer
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    (openedChange)="onDrawerOpenedChange($event)"
    class="menu-bordas"
  >
    <mat-nav-list class="d-flex items-center" (click)="onNavLinkClick()">
      @for(itemMenu of itensMenu; track $index) {
        <a mat-list-item [routerLink]="itemMenu.path" [routerLinkActiveOptions]="{exact: itemMenu.exact}" routerLinkActive="active-link">
          <div class="content-itens">
            <mat-icon>{{ itemMenu.icon }}</mat-icon>
            <span>{{ itemMenu.label }}</span>
          </div>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>

    <main class="p-8">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
