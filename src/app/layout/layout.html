<app-navbar></app-navbar>

<mat-sidenav-container class="w-full h-full">

  <mat-sidenav
    #drawer
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    (openedChange)="onDrawerOpenedChange($event)"
    class="menu-bordas"
  >
    <mat-nav-list class="d-flex items-center" (click)="onNavLinkClick()">
      <a mat-list-item routerLink="/dashboard" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active-link">
        <div class="content-itens">
          <mat-icon>home</mat-icon>
          <span>Dashboard</span>
        </div>
      </a>

      <a mat-list-item routerLink="/despesas" routerLinkActive="active-link">
        <div class="content-itens">
          <mat-icon>receipt_long</mat-icon>
          <span>Despesas</span>
        </div>
      </a>

      <a mat-list-item routerLink="/categorias">
        <div class="content-itens">
          <mat-icon>category</mat-icon>
          <span>Metas</span>
        </div>
      </a>

      <a mat-list-item routerLink="/relatorios">
        <div class="content-itens">
          <mat-icon>bar_chart</mat-icon>
          <span>Configurações</span>
        </div>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>

    <main class="p-8">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
