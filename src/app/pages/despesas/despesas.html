<span class="text-2xl">Despesas</span>
<div class="flex justify-between items-center btn-square">
  <p>Cadastre e gerencie suas despesas</p>
  <button matButton="filled">
    <mat-icon>add</mat-icon>
    Nova Despesa
  </button>
</div>

<!-- <cdk-virtual-scroll-viewport class="mt-3 scroll-container" [itemSize]="52" [maxBufferPx]="1200" [minBufferPx]="200" [style.height]="viewportHeight"> -->
  <table mat-table [dataSource]="dataSource" [trackBy]="trackBy">
    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> Descrição </th>
      <td mat-cell *matCellDef="let element"> {{element.position}} </td>
      <th mat-footer-cell *matFooterCellDef> No. </th>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Data </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      <th mat-footer-cell *matFooterCellDef> Name </th>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef> Preço </th>
      <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
      <th mat-footer-cell *matFooterCellDef> Weight </th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
<!-- </cdk-virtual-scroll-viewport> -->
<mat-paginator [pageSizeOptions]="[10, 20, 30, 40, 50]"
                showFirstLastButtons
                aria-label="Select page of periodic elements">
</mat-paginator>
