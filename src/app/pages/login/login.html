<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Meu Financeiro</mat-card-title>
      <mat-card-subtitle>Entre para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (error()) {
        <p class="login-error">{{ error() }}</p>
      }
    </mat-card-content>

    <mat-card-actions>
      <button
        mat-raised-button
        color="primary"
        type="button"
        [disabled]="loading()"
        (click)="loginWithGoogle()"
      >
        <mat-icon>login</mat-icon>
        Entrar com Google
      </button>
    </mat-card-actions>
  </mat-card>
</div>
