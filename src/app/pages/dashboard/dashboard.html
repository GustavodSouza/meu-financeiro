<div class="flex justify-between items-center">
  <div>
    <span class="text-2xl">Dashboard</span>
    <p>Visão Geral das suas finanças</p>
  </div>
  <div class="flex items-center gap-3">
    <div class="flex items-center seletor-periodo">
      <span class="material-symbols-outlined seletor-seta" (click)="retrocederMes()">chevron_left</span>
      <span class="seletor-texto">{{ mesRef }}/{{ anoRef }}</span>
      <span class="material-symbols-outlined seletor-seta" [class.disable-arrow]="periodoEhAtual" (click)="avancarMes()">chevron_right</span>
    </div>
    <div>
      <button matButton="filled" (click)="null">
        <mat-icon>add</mat-icon>
        Nova Despesa
      </button>
    </div>
  </div>
</div>
