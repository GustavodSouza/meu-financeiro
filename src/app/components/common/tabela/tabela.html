<mat-card class="mt-8" appearance="outlined">
  <span class="text-lg p-5 font-medium">Lista de Despesas</span>
  <div class="table-scroll-container">
  <table mat-table [dataSource]="dataSource" [trackBy]="trackBy" matSort (matSortChange)="sortTable($event)">
    <!-- Position Column -->
    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Descrição </th>
      <td mat-cell *matCellDef="let element"> {{ element.descricao }} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="data">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Data </th>
      <td mat-cell *matCellDef="let element"> {{element.data}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="preco">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Preço </th>
      <td mat-cell *matCellDef="let element"> {{element.preco | currency:'BRL'}} </td>
    </ng-container>

    <ng-container matColumnDef="acoes" stickyEnd>
      <th mat-header-cell *matHeaderCellDef class="text-center"> Ações </th>
      <td mat-cell *matCellDef="let element">
        <div class="acoes-botoes">
          <button class="btn-acao btn-editar" (click)="openDialogEditar(element)" aria-label="Editar despesa">
            <mat-icon>edit</mat-icon>
          </button>
          <button class="btn-acao btn-excluir" (click)="openDialogExcluir(element)" aria-label="Excluir despesa">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <!-- Filter row -->
    <ng-container matColumnDef="descricao-filtro">
      <th mat-header-cell *matHeaderCellDef>
        <input
          class="filtro-coluna"
          type="text"
          placeholder="Filtrar..."
          [(ngModel)]="filtros.descricao"
          (ngModelChange)="aplicarFiltro()"
        />
      </th>
    </ng-container>

    <ng-container matColumnDef="data-filtro">
      <th mat-header-cell *matHeaderCellDef>
        <input
          class="filtro-coluna"
          type="text"
          placeholder="Filtrar..."
          [(ngModel)]="filtros.data"
          (ngModelChange)="aplicarFiltro()"
        />
      </th>
    </ng-container>

    <ng-container matColumnDef="preco-filtro">
      <th mat-header-cell *matHeaderCellDef>
        <input
          class="filtro-coluna"
          type="text"
          placeholder="Filtrar..."
          [(ngModel)]="filtros.preco"
          (ngModelChange)="aplicarFiltro()"
        />
      </th>
    </ng-container>

    <ng-container matColumnDef="acoes-filtro" stickyEnd>
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">Nenhum registro encontrado</td>
    </tr>
  </table>
  </div>
  <mat-paginator [pageSizeOptions]="[10, 20, 30, 40, 50]"
                  showFirstLastButtons
                  aria-label="Select page of periodic elements">
  </mat-paginator>
</mat-card>
